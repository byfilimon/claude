name: Build & deploy to VPS

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      CERT_EMAIL: ${{ secrets.CERT_EMAIL }}
      DOMAIN: zamer.2pietro.com.pl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Deploy to VPS
        if: env.VPS_HOST != ''
        run: bash deploy/deploy.sh
      - name: Deploy skipped
        if: env.VPS_HOST == ''
        run: echo "::warning::Секрет VPS_HOST не задан — сборка готова, но на сервер не выложена"
